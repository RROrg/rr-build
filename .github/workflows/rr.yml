name: Build RR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "format %y.%-m.$i or auto"
        required: false
        type: string
      prerelease:
        description: "pre release"
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        #with:
        #  lfs: 'true'

      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: RROrg/rr
          token: ${{ secrets.RRORG }}
          path: rr

      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: RROrg/rr-misc
          token: ${{ secrets.RRORG }}
          path: rr-misc

      # Install dependencies
      - name: Install dependencies
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

          sudo apt update
          sudo apt install -y locales busybox dialog gettext sed gawk jq curl
          sudo apt install -y python-is-python3 python3-pip libelf-dev qemu-utils parted dosfstools cpio xz-utils lz4 lzma bzip2 gzip zstd
          # sudo snap install yq
          if ! type yq >/dev/null 2>&1 || ! yq --version 2>/dev/null | grep -q "v4."; then
            sudo curl -kL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/bin/yq && sudo chmod a+x /usr/bin/yq
          fi

      # calculates the version number and push
      - name: Calculate version
        id: version
        run: |
          # Calculate version

          version=""

          if [ -n "${{ inputs.version }}" ]; then
            if [ "$(echo ${{ inputs.version }} | cut -d '.' -f 1,2)" = "$(date +'%y.%-m')" ]; then
              version="${{ inputs.version }}"
            else
              LATEST_TAG="$(curl -skLH "Authorization: token ${{ secrets.RRORG }}" "https://api.github.com/repos/RROrg/rr/releases" | jq -r ".[0].tag_name" 2>/dev/null)"
              if [ -n "${LATEST_TAG}" ] && [ "$(echo ${LATEST_TAG} | cut -d '.' -f 1,2)" = "$(date +'%y.%-m')" ]; then  # format %y.%-m.$i
                version="$(echo ${LATEST_TAG} | awk -F '.' '{$3=$3+1}1' OFS='.')"
              else
                version="$(date +'%y.%-m').0"
              fi
            fi
          fi

          echo "version: ${version}"
          echo "version=${version}" >> $GITHUB_OUTPUT

          tagdate="$(date +'%Y%m%d%H%M')"
          echo "tagdate: ${tagdate}"
          echo "tagdate=${tagdate}" >> $GITHUB_OUTPUT

          cd rr
          [ "${{ inputs.prerelease }}" = "true" ] && release="pre" || release=""
          if [ -n "${version}" ]; then
            echo "${version}" >VERSION
            echo "${version}" >files/mnt/p1/RR_VERSION
            sed -i "s/^RR_RELEASE=.*$/RR_RELEASE=\"${release}\"/; s/^RR_VERSION=.*$/RR_VERSION=\"${version}\"/" files/initrd/opt/rr/include/consts.sh

            git checkout main
            git pull
            status=$(git status -s | awk '{printf " %s", $2}')
            if [ -n "${status}" ]; then
              git add ${status}
              git commit -m "update $(date +%Y-%m-%d" "%H:%M:%S)"
              git push -f
            fi
          else
            echo "${tagdate}" >VERSION
            echo "${tagdate}" >files/mnt/p1/RR_VERSION
            sed -i "s/^RR_RELEASE=.*$/RR_RELEASE=\"${release}\"/; s/^RR_VERSION=.*$/RR_VERSION=\"${tagdate}\"/" files/initrd/opt/rr/include/consts.sh
          fi
          cd -

      # Convert po2mo, Get exts
      - name: Convert po2mo, Get extractor, LKMs, addons and Modules
        run: |
          . rr/scripts/func.sh "${{ secrets.RRORG }}"

          echo "Get extractor"
          getCKs "rr/files/mnt/p3/cks" "true"
          getLKMs "rr/files/mnt/p3/lkms" "true"
          getAddons "rr/files/mnt/p3/addons" "true"
          getModules "rr/files/mnt/p3/modules" "true"
          getBuildroot "rr/files/mnt/p3" "true"
          getExtractor "rr/files/mnt/p3/extractor"

          echo "Repack initrd"
          convertpo2mo "rr/files/initrd/opt/rr/lang"
          repackInitrd "rr/files/mnt/p3/initrd-rr" "rr/files/initrd"

          echo "docker build and push"
          version="${{ steps.version.outputs.version }}"
          if [ -n "${version}" ]; then
            unpackInitrd "rr/files/mnt/p3/initrd-rr" "rr-misc/docker/rr/initrd"
            echo "${{ secrets.DOCKERHUB_PASSWORD }}" | sudo docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            sudo docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/rr:${version} -t ${{ secrets.DOCKERHUB_USERNAME }}/rr:latest -f rr-misc/docker/rr/Dockerfile rr-misc/docker/rr/
            sudo docker push ${{ secrets.DOCKERHUB_USERNAME }}/rr:${version}
            sudo docker push ${{ secrets.DOCKERHUB_USERNAME }}/rr:latest
          fi

      # Build incremental
      - name: Build image
        run: |
          cd rr
          . scripts/func.sh "${{ secrets.RRORG }}"

          echo "Create RR image"
          gzip -dc "files/initrd/opt/rr/grub.img.gz" >"grub.img"
          resizeImg "grub.img" "+2048M" "rr.img"
          fdisk -l "rr.img"
          repackImg files "rr.img"

          echo "Create RR ova"
          convertova "rr.img" "rr.ova"

          echo "Create RR vhd"
          qemu-img convert rr.img -O vpc rr.vhd
          createvmc "rr.vhd" "rr.vmc"

      # Zip image and generate checksum
      - name: Pack
        run: |
          cd rr
          version="${{ steps.version.outputs.version }}"
          tagdate="${{ steps.version.outputs.tagdate }}"
          version="${version:-"${tagdate}"}"

          sha256sum rr.img >sha256sum
          zip -9 "rr-${version}.img.zip" rr.img sha256sum

          sha256sum rr.ova >sha256sum
          zip -9 "rr-${version}.ova.zip" rr.ova sha256sum
  
          sha256sum rr.vhd  >sha256sum
          sha256sum rr.vmc >>sha256sum
          zip -9 "rr-${version}.vhd.zip" rr.vhd rr.vmc sha256sum

          # update.zip
          sha256sum update-list.yml update-check.sh >sha256sum
          zip -9j "update-${version}.zip" update-list.yml update-check.sh
          while read F; do
            if [ -d "${F}" ]; then
              FTGZ="$(basename "${F}").tgz"
              tar -zcf "${FTGZ}" -C "${F}" .
              sha256sum "${FTGZ}" >>sha256sum
              zip -9j "update-${version}.zip" "${FTGZ}"
              rm -f "${FTGZ}"
            else
              (cd $(dirname "${F}") && sha256sum $(basename "${F}")) >>sha256sum
              zip -9j "update-${version}.zip" "${F}"
            fi
          done <<<$(yq '.replace | explode(.) | to_entries | map([.key])[] | .[]' update-list.yml)
          zip -9j "update-${version}.zip" sha256sum

          # updateall.zip
          rm -f sha256sum
          echo '  "files/mnt/p3/cks/": "/mnt/p3/cks/"' >>update-list.yml
          echo '  "files/mnt/p3/lkms/": "/mnt/p3/lkms/"' >>update-list.yml
          echo '  "files/mnt/p3/addons/": "/mnt/p3/addons/"' >>update-list.yml
          echo '  "files/mnt/p3/modules/": "/mnt/p3/modules/"' >>update-list.yml

          zip -9j "updateall-${version}.zip" update-list.yml update-check.sh
          while read F; do
            if [ -d "${F}" ]; then
              FTGZ="$(basename "${F}").tgz"
              tar -zcf "${FTGZ}" -C "${F}" .
              sha256sum "${FTGZ}" >>sha256sum
              zip -9j "updateall-${version}.zip" "${FTGZ}"
              rm -f "${FTGZ}"
            else
              (cd $(dirname "${F}") && sha256sum $(basename "${F}")) >>sha256sum
              zip -9j "updateall-${version}.zip" "${F}"
            fi
          done <<<$(yq '.replace | explode(.) | to_entries | map([.key])[] | .[]' update-list.yml)
          zip -9j "updateall-${version}.zip" sha256sum

          # sha256sum
          sha256sum "rr-${version}.img.zip"     >sha256sum
          sha256sum "rr-${version}.ova.zip"    >>sha256sum
          sha256sum "rr-${version}.vhd.zip"    >>sha256sum
          sha256sum "update-${version}.zip"    >>sha256sum
          sha256sum "updateall-${version}.zip" >>sha256sum

      # Upload artifact
      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rr.img
          path: |
            rr/rr-*.img.zip
          retention-days: 5

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rr.ova
          path: |
            rr/rr-*.ova.zip
          retention-days: 5

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rr.vhd
          path: |
            rr/rr-*.vhd.zip
          retention-days: 5

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: updateall
          path: |
            rr/updateall-*.zip
          retention-days: 5

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: update
          path: |
            rr/update-*.zip
          retention-days: 5

      # Publish a release if is a tag
      - name: Release
        if: success() && steps.version.outputs.version != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          prerelease: ${{ inputs.prerelease }}
          artifacts: |
            rr/rr-*.zip
            rr/updateall-*.zip
            rr/sha256sum
          body: |
            - Please do not upgrade this version now (In release testing...),
            - Please upgrade after updating the Changelog ...
          owner: RROrg
          repo: rr
          token: ${{ secrets.RRORG }}
